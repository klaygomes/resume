name: publish

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install groff
        run: sudo apt-get update -qq && sudo apt-get install -y -qq groff ghostscript

      - name: Publish a new version
        id: publish
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "cleiton@$version" version >/dev/null 2>&1; then
            echo "cleiton@$version is already on npm"
            exit 0
          fi
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Deploy cleiton.se
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: gh api repos/klaygomes/cleiton.se/dispatches -f event_type=resume-published -f "client_payload[version]=$VERSION"
